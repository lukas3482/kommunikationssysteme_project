# MQTT Broker Verbindung
mqtt.broker=tcp://192.168.178.150:1883
mqtt.clientId=raspberry-sensor-01
mqtt.topic=sensor/imu
mqtt.qos=1
# mqtt.username=
# mqtt.password=

# I2C Bus des Raspberry Pi (Standard: 1)
sensor.i2cBus=1

# I2C-Adressen des LSM9DS1 (Sense HAT Standard: AG=0x6A, MAG=0x1C)
# Falls i2cdetect andere Adressen zeigt (z.B. 0x6B / 0x1E) hier anpassen:
sensor.agAddr=0x6B
sensor.magAddr=0x0C

# Auslesezyklus in Millisekunden
sensor.intervalMs=1000
