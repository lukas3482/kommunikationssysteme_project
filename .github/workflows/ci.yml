name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:

  # ── Java: Build, Test, Static Analysis ──────────────────────────────────────
  java:
    name: Java — build / test / check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build (skip tests)
        run: make build

      - name: Unit Tests
        run: make test-java

      - name: Static Analysis (PMD)
        run: make check-java

  # ── Python: Test, Static Analysis ───────────────────────────────────────────
  python:
    name: Python — test / check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r python_visu/requirements.txt \
                      -r python_visu/requirements-dev.txt

      - name: Unit Tests (pytest)
        run: make test-py

      - name: Static Analysis (ruff)
        run: make check-py
